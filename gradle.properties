# Mémoire allouée à Gradle. Peut être surchargée en ligne de commande.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment : noms de paramètres lisibles pour le code de Minecraft.
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Environnement
# Versions NeoForge : https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.266
loader_version_range=[1,)

## Propriétés du mod
mod_id=starrysky
mod_name=Starry Sky
mod_license=MIT
mod_version=1.0.0
mod_group_id=fr.evan.starrysky
mod_authors=Evan
