# Métadonnées du mod. Les ${...} sont remplacés par les valeurs de gradle.properties au moment du build.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Description affichée dans la liste des mods. Elle est traduite via la clé
# fml.menu.mods.info.description.${mod_id} des fichiers de langue ; ce texte sert de secours.
description='''
A more beautiful night sky: more stars, varied sizes and colors, gentle twinkling and shooting stars. Client-side only.
'''
# Note : pas de clé « displayTest ». Elle a été supprimée dans NeoForge 20.5+ (FML 4 ne la lit plus).
# Depuis, la compatibilité client/serveur se négocie uniquement sur les canaux réseau déclarés.
# Ce mod n'en déclare aucun : il peut rejoindre n'importe quel serveur, et un serveur ne l'exige jamais.

# Unique mixin du mod : masque les étoiles de base (voir LevelRendererMixin).
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
